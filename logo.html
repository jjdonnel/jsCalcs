<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RhodyCalcs Glassmorphic Logo</title>
    <style>
        :root {
            /* Jack of All Voices / RhodyCalcs Dark Theme Colors */
            --bg-dark: #0b0f19;
            --panel-bg: rgba(18, 26, 43, 0.75);
            --accent-cyan: #00f0ff;
            --accent-blue: #0066ff;
            --text-main: #ffffff;
            --border-light: rgba(0, 240, 255, 0.25);
            --shadow-glow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 102, 255, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 80% 100%, rgba(0, 240, 255, 0.08) 0%, transparent 50%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* Glassmorphic Logo Card */
        .logo-card {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 64px;

            /* Gradient glass overlay from top-left to bottom-right */
            background: linear-gradient(
                135deg,
                rgba(11, 15, 25, 0.85) 0%,
                rgba(18, 26, 43, 0.8) 40%,
                rgba(0, 102, 255, 0.35) 80%,
                rgba(0, 240, 255, 0.25) 100%
            );
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--border-light);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.5);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        /* Isolated SVG Icon Styling */
        .icon-svg {
            width: 160px;
            height: 140px;
            /* Outer cyan drop-glow to isolate icon against glass background */
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.4));
        }

        /* RhodyCalcs Brand Text */
        .brand-name {
            font-size: 1.75rem;
            font-weight: 600;
            font-style: italic;
            color: var(--text-main);
            letter-spacing: -0.5px;
            /* Gradient text effect matching header styling */
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }
    </style>
</head>

<body>

    <div class="logo-card">
        <!-- Icon combining Square Root and Pi in Cyan / White accent colors -->
        <svg class="icon-svg" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Square Root Sign -->
            <path d="M 20 95 L 45 95 L 70 140 L 115 30 L 180 30" stroke="url(#cyanGradient)" stroke-width="16"
                stroke-linecap="round" stroke-linejoin="round" />

            <!-- Pi Symbol nested under the radical -->
            <path d="M 120 70 L 165 70" stroke="#ffffff" stroke-width="11" stroke-linecap="round" />
            <path d="M 132 70 L 130 115 C 130 118 127 122 122 122" stroke="#ffffff" stroke-width="10"
                stroke-linecap="round" fill="none" />
            <path d="M 152 70 L 154 122" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

            <!-- SVG Gradient Definition -->
            <defs>
                <linearGradient id="cyanGradient" x1="20" y1="30" x2="180" y2="140" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#00f0ff" />
                </linearGradient>
            </defs>
        </svg>

        <!-- Brand Name -->
        <div class="brand-name">RhodyCalcs</div>
    </div>

    <script>
  // Save icon when pressing the 'S' key on your keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 's') {
      exportLogoIcon(192, 'icon-192.png');
      exportLogoIcon(512, 'icon-512.png');
    }
  });

  function exportLogoIcon(size, fileName) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Create dark gradient background
    const bgGrad = ctx.createLinearGradient(0, 0, size, size);
    bgGrad.addColorStop(0, '#0b0f19');
    bgGrad.addColorStop(0.4, '#121a2b');
    bgGrad.addColorStop(0.8, '#0040b3');
    bgGrad.addColorStop(1, '#00f0ff');

    // Draw rounded rectangle card
    const cornerRadius = size * 0.2; // Matching border-radius proportion
    ctx.fillStyle = bgGrad;
    ctx.beginPath();
    ctx.roundRect(0, 0, size, size, cornerRadius);
    ctx.fill();

    // Render the SVG icon into the canvas center
    const svgElement = document.querySelector('.icon-svg');
    const svgData = new XMLSerializer().serializeToString(svgElement);
    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const URL = window.URL || window.webkitURL || window;
    const blobURL = URL.createObjectURL(svgBlob);

    const img = new Image();
    img.onload = function () {
      const iconSize = size * 0.55;
      const x = (size - iconSize) / 2;
      const y = (size - iconSize) / 2.2;
      ctx.drawImage(img, x, y, iconSize, iconSize);

      // Trigger automatic PNG download
      const a = document.createElement('a');
      a.download = fileName;
      a.href = canvas.toDataURL('image/png');
      a.click();
      URL.revokeObjectURL(blobURL);
    };
    img.src = blobURL;
  }
</script>

</body>

</html>
