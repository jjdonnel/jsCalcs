<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>RhodyCalcs</title>
    <meta name="description" content="Quick conversion and financial calculators.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="displayHome()">

    <nav class="navbar">
        <!-- Hamburger Icon & Trigger -->
        <input type="checkbox" class="menuOpen" id="top" />
        <label for="top" id="icon" class="label">
            <span>&#9776;</span>
        </label>

        <!-- App Branding Header -->
        <h1 class="brand-title" onclick="displayHome()">RhodyCalcs</h1>

        <!-- Slide-out / Dropdown Menu -->
        <ul class="menu">
            <li class="items" onclick="displayHome(); uncheckMenu();">Home</li>
            
            <li id="conversions">
                <input type="checkbox" class="menuInput" id="A" />
                <label for="A" class="label">Conversions</label>
                <span class="arrow">&#9662;</span>
                <ul id="convSub" class="subMenu">
                    <li class="items" onclick="displayTemperature(); uncheckMenu();">Temp</li>
                    <li class="items" onclick="displayPressure(); uncheckMenu();">Pressure</li>
                    <li class="items" onclick="displayCloudBase(); uncheckMenu();">CloudBase</li>
                </ul>
            </li>

            <li id="finance">
                <input type="checkbox" class="menuInput" id="B" />
                <label for="B" class="label">Finance</label>
                <span class="arrow">&#9662;</span>
                <ul id="finSub" class="subMenu">
                    <li class="items" onclick="displayFutureValue(); uncheckMenu();">FutureValue</li>
                    <li class="items" onclick="displayCompoundInterest(); uncheckMenu();">CompInt</li>
                    <li class="items" onclick="displayMortgage(); uncheckMenu();">Mortgage</li>
                </ul>
            </li>
        </ul>
    </nav>

    <main id="main" class="container"></main>

    <script src="calcs.js"></script>
    <script src="./components/compoundInterest.js"></script>
    <script src="./components/pressure.js"></script>
    <script src="./components/futureValue.js"></script>
    <script src="./components/temperature.js"></script>
    <script src="./components/cloudBase.js"></script>
    <script src="./components/home.js"></script>
    <script src="./components/mortgage.js"></script>

    <script>
      // Automatically closes the CSS menu when a user picks a calculator
      function uncheckMenu() {
        document.getElementById('top').checked = false;
      }
    </script>
</body>

</html>
